name: Build MemorySweep 26.2

on:
  push:
    branches: ["1.20.1"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew && ls -la gradle/wrapper
      - name: Verify Gradle
        run: ./gradlew --version
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --info 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemorySweep-build-diagnostics
          path: build.log
          if-no-files-found: warn
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MemorySweep-26.2
          path: build/libs/*.jar
          if-no-files-found: error
